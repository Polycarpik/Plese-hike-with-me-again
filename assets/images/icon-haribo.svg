<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="20" height="20">
  <defs>
    <radialGradient id="gummyGold" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffe566"/>
      <stop offset="45%" stop-color="#f7a81b"/>
      <stop offset="85%" stop-color="#d96b06"/>
      <stop offset="100%" stop-color="#a84300"/>
    </radialGradient>
    <radialGradient id="gummyBelly" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff3a1" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#f7a81b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d96b06" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Gummy Bear Ears -->
  <circle cx="20" cy="13" r="7.5" fill="url(#gummyGold)"/>
  <circle cx="44" cy="13" r="7.5" fill="url(#gummyGold)"/>
  <circle cx="19" cy="11.5" r="3" fill="#fff7b8" opacity="0.65"/>
  <circle cx="43" cy="11.5" r="3" fill="#fff7b8" opacity="0.65"/>
  <!-- Gummy Bear Body / Torso -->
  <rect x="17" y="29" width="30" height="26" rx="13" fill="url(#gummyGold)"/>
  <!-- Gummy Bear Arms (nubs on sides) -->
  <ellipse cx="15" cy="38" rx="6.5" ry="5.5" fill="url(#gummyGold)"/>
  <ellipse cx="49" cy="38" rx="6.5" ry="5.5" fill="url(#gummyGold)"/>
  <!-- Gummy Bear Feet (round pads at bottom) -->
  <ellipse cx="21" cy="53" rx="7.5" ry="6.5" fill="url(#gummyGold)"/>
  <ellipse cx="43" cy="53" rx="7.5" ry="6.5" fill="url(#gummyGold)"/>
  <!-- Gummy Bear Head -->
  <ellipse cx="32" cy="22.5" rx="15.5" ry="13.5" fill="url(#gummyGold)"/>
  <!-- Translucent gummy belly glow -->
  <ellipse cx="32" cy="42" rx="9.5" ry="8.5" fill="url(#gummyBelly)"/>
  <!-- Gummy Bear Snout & Eyes -->
  <ellipse cx="32" cy="25" rx="5.5" ry="4" fill="#ffe875" opacity="0.75"/>
  <circle cx="26" cy="20.5" r="2" fill="#7c2d00" opacity="0.85"/>
  <circle cx="38" cy="20.5" r="2" fill="#7c2d00" opacity="0.85"/>
  <ellipse cx="32" cy="24" rx="2.4" ry="1.7" fill="#7c2d00" opacity="0.9"/>
  <path d="M28.5 27.5 Q32 30.2 35.5 27.5" fill="none" stroke="#7c2d00" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
  <!-- Shiny jelly specular highlights -->
  <ellipse cx="26" cy="14.5" rx="4.5" ry="2.2" transform="rotate(-18 26 14.5)" fill="#ffffff" opacity="0.65"/>
  <ellipse cx="14" cy="36" rx="2.2" ry="1.4" fill="#ffffff" opacity="0.5"/>
  <ellipse cx="19" cy="51.5" rx="2.8" ry="1.8" fill="#ffffff" opacity="0.5"/>
  <ellipse cx="41" cy="51.5" rx="2.8" ry="1.8" fill="#ffffff" opacity="0.5"/>
</svg>
